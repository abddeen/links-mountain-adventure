<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Amazing Link's Adventures: Climbing the Mountain</title>
<style>
  :root { --bg:#0d1820; --fg:#f3ead2; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: Georgia, 'Times New Roman', serif; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; box-shadow:0 0 60px #000c; border-radius:6px; }  /* size is set by fit() */
  #pad { display:none; position:absolute; bottom:16px; left:50%; margin-left:-75px; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, #0d182055 40%, #0d1820aa 100%); border:2px solid #f3ead255; touch-action:none; }
  #pad .arm { position:absolute; background:#f3ead222; border-radius:10px; pointer-events:none; }
  #pad .h { left:12px; right:12px; top:56px; height:38px; } #pad .v { top:12px; bottom:12px; left:56px; width:38px; }
  #pad .tri { position:absolute; width:0; height:0; border:9px solid transparent; pointer-events:none; opacity:.55; transition:opacity .08s; }
  #pad .tri.on { opacity:1; }
  #pad [data-d=up] { left:66px; top:14px; border-bottom:12px solid var(--fg); border-top:0; }
  #pad [data-d=down] { left:66px; bottom:14px; border-top:12px solid var(--fg); border-bottom:0; }
  #pad [data-d=left] { top:66px; left:14px; border-right:12px solid var(--fg); border-left:0; }
  #pad [data-d=right] { top:66px; right:14px; border-left:12px solid var(--fg); border-right:0; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff8e6, #d8ccb0 60%, #9d9178); box-shadow:0 3px 10px #000a;
    pointer-events:none; opacity:.85; }
  #stage { position:relative; line-height:0; }
  /* touch screens: d-pad floats over the bottom-left of the game, half transparent */
  #atk { display:none; position:absolute; right:16px; bottom:40px; width:80px; height:80px; border-radius:50%;
    border:2px solid #f3ead288; background:radial-gradient(circle at 35% 30%, #c94a3a, #7a1f16); color:#fff;
    font-size:34px; opacity:.6; touch-action:none; }
  @media (pointer:coarse) {
    canvas { border-radius:0; box-shadow:none; }
    #pad { display:block; opacity:.5; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
  <canvas id="game"></canvas>
  <div id="pad">
    <div class="arm h"></div><div class="arm v"></div>
    <div class="tri" data-d="up"></div><div class="tri" data-d="down"></div>
    <div class="tri" data-d="left"></div><div class="tri" data-d="right"></div>
    <div id="knob"></div>
  </div>
  <button id="atk" aria-label="Attack">⚔</button>
  </div>
</div>
<script>
(() => {
const W = 480, TH = 1440;
let H = 720; // on touch screens the playfield grows taller to fill the phone
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const touch = matchMedia('(pointer:coarse)').matches;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  H = touch ? Math.round(Math.min(TH * .75, Math.max(720, W * vh / vw))) : 720;
  cvs.width = W * dpr; cvs.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = Math.min(vw / W, vh / H);
  cvs.style.width = W * k + 'px'; cvs.style.height = H * k + 'px';
  if (P) P.y = Math.min(P.y, H - 34);
}
let P; // player, declared early so fit() can clamp it on resize
fit();
addEventListener('resize', fit);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = Math.random;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- Mountain wall (pre-rendered, vertically tiling) ----------
const wall = (() => {
  const t = document.createElement('canvas'); t.width = W * 2; t.height = TH * 2;
  const g = t.getContext('2d'); g.scale(2, 2);
  const r = rng(11);
  const grd = g.createLinearGradient(0, 0, W, 0);
  grd.addColorStop(0, '#54443a'); grd.addColorStop(.5, '#6e5a4a'); grd.addColorStop(1, '#4e4036');
  g.fillStyle = grd; g.fillRect(0, 0, W, TH);
  const wrap = fn => { for (const dy of [-TH, 0, TH]) { g.save(); g.translate(0, dy); fn(); g.restore(); } };
  const poly = pts => { g.beginPath(); pts.forEach((p, j) => j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };

  // stone slabs
  for (let i = 0; i < 340; i++) {
    const x = r() * W, y = r() * TH, s = 18 + r() * 60, n = 5 + (r() * 4 | 0), pts = [];
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + r() * .5, rr = s * (.6 + r() * .5);
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * .7]); }
    const col = `hsl(${20 + r() * 16},${14 + r() * 16}%,${28 + r() * 24}%)`;
    wrap(() => {
      g.fillStyle = col; poly(pts); g.fill();
      g.save(); g.translate(0, 2); g.strokeStyle = 'rgba(20,12,8,.5)'; g.lineWidth = 2; poly(pts); g.stroke(); g.restore();
      g.save(); g.translate(-1, -1.5); g.strokeStyle = 'rgba(255,236,200,.13)'; g.lineWidth = 1.5; poly(pts); g.stroke(); g.restore();
    });
  }
  // cracks
  for (let i = 0; i < 70; i++) {
    let x = r() * W, y = r() * TH; const seg = [[x, y]];
    for (let k = 0; k < 6 + r() * 8; k++) { x += (r() - .5) * 30; y += 6 + r() * 16; seg.push([x, y]); }
    wrap(() => { g.strokeStyle = 'rgba(18,10,6,.55)'; g.lineWidth = .8 + r() * 1.6; g.beginPath();
      seg.forEach((p, j) => j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); });
  }
  // ledges with grass
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y = r() * TH, w = 40 + r() * 110;
    const tufts = []; for (let k = 0; k < w / 6; k++) tufts.push([x + r() * w, 3 + r() * 8, (r() - .5) * 4]);
    const grassy = r() < .6;
    wrap(() => {
      g.fillStyle = 'rgba(15,9,6,.55)'; g.fillRect(x, y + 3, w, 5);
      g.fillStyle = '#8a735e'; g.fillRect(x, y, w, 4);
      g.fillStyle = 'rgba(255,240,210,.25)'; g.fillRect(x, y, w, 1);
      if (grassy) { g.lineWidth = 1.4; for (const [tx, th, lean] of tufts) {
        g.strokeStyle = th > 7 ? '#8fbf4a' : '#5f9a3a'; g.beginPath(); g.moveTo(tx, y + 1); g.lineTo(tx + lean, y - th); g.stroke(); } }
    });
  }
  // moss
  for (let i = 0; i < 40; i++) {
    const x = r() * W, y = r() * TH, s = 8 + r() * 26;
    wrap(() => { g.fillStyle = 'rgba(96,140,60,.22)'; g.beginPath(); g.ellipse(x, y, s, s * .5, r(), 0, 7); g.fill(); });
  }
  return t;
})();

// ---------- State ----------
let state = 'title', best = 0;
try { best = +localStorage.getItem('cliffside-best') || 0; } catch (e) {}
let rocks, warns, parts, clouds, scroll, time = 0, spawnT, shake, deco;
let level = 1, clearT = 0, bannerT = 0, startY = 0, healed = false, fadeT = 0, fadeIn = 0, pausedFrom = 'play';
const GOAL = 1800; // 100 m per level at 18 px per metre
// the plateau is drawn in perspective: depth d runs from 0 (cliff edge) to DMAX (foot of the next cliff)
const DMAX = 2, WALK = .55, PLAT_HW = W * 1.6; // wide enough to reach both screen edges at the far cliff
const keys = {};

// what waits on each plateau; later levels can add bigger rewards and tougher guards
const PLATEAUS = {
  1: { item: 'sword' },
  2: { item: 'shield', guard: 'bokoblin' },
};
const CHEST_X = W / 2 + W * .56, CHEST_D = DMAX / 2; // right side of the screen, halfway across the plateau
const DEPTH_PX = 260; // how many world px one unit of depth counts as, for distances on the plateau
let inv = {}, chest = null, bok = null, popup = null, popupT = 0, unlockT = 0, overMsg = 'You fell!', floats = [];

function reset() {
  inv = {};
  level = 1;
  P = { x: W / 2, y: H * .72, anim: 0, moving: false, stam: 100, exhausted: false, hearts: 3, inv: 0, vy: 0, rot: 0, flash: 0 };
  clouds = Array.from({ length: 5 }, () => newCloud(rand() * H));
  startLevel();
}
function startLevel() {
  Object.assign(P, { x: W / 2, y: H * .72, moving: false, stam: 100, exhausted: false, inv: 0, vy: 0, rot: 0, px: W / 2, pd: 0, face: 'back' });
  rocks = []; warns = []; parts = []; scroll = 0; spawnT = 1.2; shake = 0; bannerT = 2.2;
  deco = makeDeco(level);
  P.shieldUsed = false; P.atk = 0; P.atkCd = 0; P.side = 1;
  const cfg = PLATEAUS[level];
  chest = cfg ? { x: CHEST_X, d: CHEST_D, item: cfg.item, locked: !!cfg.guard, opened: false, given: false, t: 0 } : null;
  bok = cfg?.guard ? { x: CHEST_X - 150, d: CHEST_D + .2, hp: 3, phase: 'idle', t: 0, anim: 0, stun: 0, kx: 0, kd: 0, face: -1 } : null;
  popup = null; unlockT = 0; floats = [];
}
const pdist = (x1, d1, x2, d2) => Math.hypot(x1 - x2, (d1 - d2) * DEPTH_PX);
// scenery for this level's plateau; props use world x and depth d
function makeDeco(seed) {
  const r = rng(seed * 7919 + 3), ridge = (step, lo, hi) => {
    const pts = []; for (let x = -20; x <= W + 40; x += step * (.6 + r() * .8)) pts.push([x, lo + r() * (hi - lo)]); return pts; };
  const wx = () => W / 2 + (r() * 2 - 1) * W;
  return {
    far: ridge(46, 40, 110), near: ridge(34, 14, 44),
    trees: Array.from({ length: 6 }, () => [wx(), .2 + r() * 1.6]).filter(([x, d]) => pdist(x, d, CHEST_X, CHEST_D) > 150),
    bushes: Array.from({ length: 12 }, () => [wx(), .1 + r() * 1.8, 6 + r() * 8]).filter(([x, d]) => pdist(x, d, CHEST_X, CHEST_D) > 90),
    flowers: Array.from({ length: 90 }, () => [wx(), r() * DMAX, ['#fff4e0', '#f5d04a', '#e86a8a', '#9ec8ff'][r() * 4 | 0]]),
    blades: Array.from({ length: 110 }, () => [r() * W, 4 + r() * 9, (r() - .5) * 5]),
    jag: Array.from({ length: 24 }, () => [r() * 22, r() * 22]),
  };
}
function newCloud(y) { return { x: rand() * W, y, s: 40 + rand() * 70, v: 6 + rand() * 12, a: .08 + rand() * .14 }; }
const surfaceY = () => scroll - GOAL + H * .3;  // screen y of the plateau lip
const PAN = () => H * .58;                      // extra scroll that brings the plateau into full view
// perspective helpers for a plateau whose lip is at screen y = s
const horizon = s => s - H * .75;
const scaleAt = d => 1 / (1 + d);
const yAt = (s, d) => horizon(s) + H * .75 * scaleAt(d);
const xAt = (x, d) => W / 2 + (x - W / 2) * scaleAt(d);
const height = () => Math.min(100, Math.floor(scroll / 18));
const total = () => (level - 1) * 100 + height();
function saveBest() { if (total() > best) { best = total(); try { localStorage.setItem('cliffside-best', best); } catch (e) {} } }
reset();

// ---------- Input ----------
// `keys` is the merged state update()/draw() read; each source (keyboard, touch d-pad,
// gamepad) owns its own map so one source releasing a direction can't clobber another's.
const kbKeys = {}, touchKeys = {}, padKeys = {};
function syncKeys() { for (const d of ['up', 'down', 'left', 'right']) keys[d] = kbKeys[d] || touchKeys[d] || padKeys[d]; }
const map = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (map[e.code]) { kbKeys[map[e.code]] = true; syncKeys(); e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primary(); }
  if (e.code === 'KeyJ' || e.code === 'KeyX') attack();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
addEventListener('keyup', e => { if (map[e.code]) { kbKeys[map[e.code]] = false; syncKeys(); } });
addEventListener('blur', () => {
  for (const d of ['up', 'down', 'left', 'right']) kbKeys[d] = touchKeys[d] = padKeys[d] = keys[d] = false;
  if (state === 'play' || state === 'plateau') togglePause();
});
function togglePause() {
  if (state === 'play' || state === 'plateau') { pausedFrom = state; state = 'paused'; }
  else if (state === 'paused') state = pausedFrom;
}
cvs.addEventListener('pointerdown', primary);
// touch d-pad: keep a finger down and slide it around; direction follows the finger (8-way)
const pad = document.getElementById('pad'), knob = document.getElementById('knob');
const tris = Object.fromEntries([...pad.querySelectorAll('.tri')].map(t => [t.dataset.d, t]));
let padId = null;
function padSet(dx, dy) {
  const len = Math.hypot(dx, dy), max = 46, k = len > max ? max / len : 1;
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  const nx = len > 14 ? dx / len : 0, ny = len > 14 ? dy / len : 0; // dead zone in the middle
  const dirs = { right: nx > .38, left: nx < -.38, down: ny > .38, up: ny < -.38 };
  for (const d in dirs) { touchKeys[d] = dirs[d]; tris[d].classList.toggle('on', dirs[d]); }
  syncKeys();
}
function padMove(e) { const r = pad.getBoundingClientRect(); padSet(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2); }
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); padId = e.pointerId; pad.setPointerCapture(padId); padMove(e);
  if (state !== 'play' && state !== 'plateau') primary(); // on the plateau the pad only walks
});
const atkBtn = document.getElementById('atk');
atkBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); attack(); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture'])
  pad.addEventListener(ev, e => { if (e.pointerId === padId) { padId = null; padSet(0, 0); } });
function primary() {
  audio();
  if (state === 'title' || state === 'over') { reset(); state = 'play'; }
  else if (state === 'paused') state = pausedFrom;
  else if (state === 'item' && popupT > .6) { popup = null; state = 'plateau'; }
  else if (state === 'plateau') attack();
}

// ---------- Sound (Web Audio, synthesized so there are no files to load) ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, at, dur, type = 'square', vol = .1, f2) {
  const a = AC; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function sfxFanfare() {
  if (!audio()) return;
  [[392, 0], [523.3, .12], [659.3, .24], [784, .36]].forEach(([f, at]) => tone(f, at, .16, 'square', .08));
  for (const f of [1046.5, 784, 659.3]) tone(f, .5, .9, 'triangle', .1);   // bright held chord
  [2093, 2637, 3136, 2637].forEach((f, i) => tone(f, .55 + i * .08, .25, 'sine', .04)); // sparkle
}
const sfxSwing = () => audio() && tone(900, 0, .12, 'sawtooth', .04, 250);
const sfxHit = () => { if (audio()) { tone(180, 0, .14, 'square', .1, 70); tone(90, 0, .2, 'triangle', .12); } };
const sfxHurt = () => audio() && tone(300, 0, .3, 'sawtooth', .08, 90);
const sfxUnlock = () => { if (audio()) { tone(660, 0, .1, 'square', .07); tone(990, .1, .25, 'square', .07); } };
const sfxBlock = () => audio() && tone(1400, 0, .15, 'triangle', .1, 900);

// Switch controller (or any standard gamepad) paired over Bluetooth: polled per frame
// since the Gamepad API has no held-button/stick event stream, and merged into the
// same `keys`/`primary()`/`togglePause()` used by keyboard and the touch d-pad.
let padPrimaryHeld = false, padStartHeld = false;
function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = [...pads].find(g => g);
  const dz = .25;
  const ax = gp ? gp.axes[0] ?? 0 : 0, ay = gp ? gp.axes[1] ?? 0 : 0;
  padKeys.right = !!(gp && (ax > dz || gp.buttons[15]?.pressed));
  padKeys.left = !!(gp && (ax < -dz || gp.buttons[14]?.pressed));
  padKeys.down = !!(gp && (ay > dz || gp.buttons[13]?.pressed));
  padKeys.up = !!(gp && (ay < -dz || gp.buttons[12]?.pressed));
  syncKeys();
  if (!gp) { padPrimaryHeld = padStartHeld = false; return; }

  // face buttons (index 0/1 covers both under Nintendo's swapped B/A glyph layout)
  const primaryDown = !!(gp.buttons[0]?.pressed || gp.buttons[1]?.pressed);
  if (primaryDown && !padPrimaryHeld) primary();
  padPrimaryHeld = primaryDown;

  const startDown = !!gp.buttons[9]?.pressed;
  if (startDown && !padStartHeld) togglePause();
  padStartHeld = startDown;
}

// ---------- Update ----------
function spawnRock(x) {
  warns.push({ x: x ?? 30 + rand() * (W - 60), size: 12 + rand() * 24, t: .75 });
}
function makeRock(w) {
  const n = 8 + (rand() * 4 | 0), pts = [];
  for (let k = 0; k < n; k++) pts.push(.72 + rand() * .32);
  // near the top of the climb, rocks tumble off the plateau lip
  return { x: w.x, y: Math.max(-w.size, surfaceY() - w.size * .5), size: w.size, pts, rot: rand() * 7, vr: (rand() - .5) * 6,
    vx: (rand() - .5) * 40, vy: 120, g: 450,
    bounceY: rand() < .35 ? H * (.15 + rand() * .45) : Infinity, shade: 30 + rand() * 15 };
}
function dust(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = rand() * 7, s = 30 + rand() * 140;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .5 + rand() * .5, r: 2 + rand() * 4, col }); }
}

function update(dt) {
  time += dt;
  if (bannerT > 0) bannerT -= dt;
  if (fadeIn > 0) fadeIn -= dt;

  // clouds drift regardless of state
  for (const c of clouds) { c.x += c.v * dt; if (c.x - c.s * 2 > W) c.x = -c.s * 2; }

  if (state === 'falling') {
    P.vy += 900 * dt; P.y += P.vy * dt; P.rot += 5 * dt;
    if (P.y > H + 120) { state = 'over'; }
  } else if (state === 'cleared') {
    // pull up over the lip, then the view pans out across the plateau
    clearT += dt;
    if (clearT < .7) {
      const e = clearT / .7;
      P.y = lerp(startY, yAt(surfaceY(), P.pd) - 28, 1 - (1 - e) ** 2); P.anim += dt * 11; P.moving = true;
    } else {
      P.moving = false;
      const e = Math.min(1, (clearT - .7) / 1.4);
      scroll = GOAL + PAN() * e * e * (3 - 2 * e);
      if (e >= 1) state = 'plateau';
    }
  } else if (state === 'plateau') {
    // walk around: up heads into the distance, down comes back toward the edge
    clearT += dt;
    const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    P.moving = !!(dx || dy);
    if (P.moving) {
      const len = Math.hypot(dx, dy);
      P.px += dx / len * 170 * dt; P.pd -= dy / len * WALK * dt; P.anim += dt * 9;
      if (dy > 0) P.face = 'front'; else if (dy < 0) P.face = 'back';
    }
    P.pd = Math.max(.02, Math.min(DMAX, P.pd));
    const lim = Math.min(PLAT_HW - 20, (W / 2 - 22) / scaleAt(P.pd)); // stay on screen
    P.px = Math.max(W / 2 - lim, Math.min(W / 2 + lim, P.px));
    if (dx) P.side = dx;
    if (P.atk > 0) P.atk -= dt;
    if (P.atkCd > 0) P.atkCd -= dt;
    if (P.inv > 0) P.inv -= dt;
    if (unlockT > 0) unlockT -= dt;
    updateBokoblin(dt);
    // walk up to the chest to open it (a locked one waits until its guard is beaten)
    if (chest && !chest.opened) {
      chest.near = pdist(P.px, P.pd, chest.x, chest.d) < 55;
      if (chest.near && !chest.locked) { chest.opened = true; chest.t = 0; }
    }
    if (chest && chest.opened && !chest.given) {
      chest.t += dt;
      if (chest.t > .6) { chest.given = true; inv[chest.item] = true; popup = ITEMS[chest.item]; popupT = 0; state = 'item'; sfxFanfare(); }
    }
    if (state === 'plateau' && P.pd >= DMAX) { state = 'enter'; fadeT = 0; P.face = 'back'; }
  } else if (state === 'enter') {
    // reached the next cliff: grab on and fade into the next level
    fadeT += dt; P.moving = true; P.anim += dt * 11;
    if (fadeT >= .7) { level++; startLevel(); state = 'play'; fadeIn = .6; }
  } else {
    // player movement
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (P.exhausted) { dx = 0; dy = 0; P.y += 35 * dt; }
    P.moving = !!(dx || dy);
    if (P.moving) {
      const len = Math.hypot(dx, dy), sp = 175;
      P.x += dx / len * sp * dt; P.y += dy / len * sp * dt;
      P.anim += dt * 11;
      P.stam -= (dy < 0 ? 17 : 10) * dt;
    } else P.stam += (P.exhausted ? 22 : 32) * dt;
    if (P.stam <= 0) { P.stam = 0; P.exhausted = true; }
    if (P.exhausted && P.stam >= 40) P.exhausted = false;
    P.stam = Math.min(100, P.stam);
    P.x = Math.max(24, Math.min(W - 24, P.x));
    P.y = Math.min(H - 34, P.y);

    // climbing past the upper band scrolls the mountain, until the plateau is in view
    const band = H * .42;
    if (P.y < band && scroll < GOAL) {
      const diff = Math.min(band - P.y, GOAL - scroll); P.y += diff; scroll += diff;
      for (const r of rocks) { r.y += diff; r.bounceY += diff; }
      for (const p of parts) p.y += diff;
      for (const c of clouds) c.y += diff * 1.4;
    }
    if (P.y - 24 <= surfaceY()) { levelComplete(); return; }
    if (P.inv > 0) P.inv -= dt;

    // each level drops more rocks: shorter gaps and more multi-rock volleys
    spawnT -= dt;
    if (spawnT <= 0) {
      const extra = Math.min(.85, (level - 1) * .18);
      spawnRock();
      if (rand() < extra) spawnRock();
      if (rand() < extra - .4) spawnRock();
      spawnT = Math.max(.2, 1.1 * .8 ** (level - 1)) * (.7 + rand() * .6);
    }
  }

  for (const w of warns) { w.t -= dt; if (w.t <= 0) rocks.push(makeRock(w)); }
  warns = warns.filter(w => w.t > 0);

  for (const r of rocks) {
    r.vy = Math.min(r.vy + r.g * dt, 900); r.y += r.vy * dt; r.x += r.vx * dt; r.rot += r.vr * dt;
    if (r.y > r.bounceY) {
      r.bounceY = Infinity; r.vy *= -.32; r.vx = (rand() - .5) * 220; r.vr *= -1.5;
      dust(r.x, r.y + r.size * .6, 8, '150,125,100');
    }
    if (r.x < r.size || r.x > W - r.size) { r.vx *= -1; r.x = Math.max(r.size, Math.min(W - r.size, r.x)); }
    if (state === 'play' && P.inv <= 0 && Math.hypot(r.x - P.x, r.y - (P.y - 4)) < r.size * .82 + 13) hit(r);
  }
  rocks = rocks.filter(r => r.y < H + 80 && !r.dead);

  for (const p of parts) { p.vy += (p.g ?? 300) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const c of clouds) if (c.y - c.s > H) Object.assign(c, newCloud(-c.s - rand() * 200));

  for (const f of floats) { f.t -= dt; f.y -= 30 * dt; }
  floats = floats.filter(f => f.t > 0);
  if (shake > 0) shake -= dt;
  if (P.flash > 0) P.flash -= dt;
}

function updateBokoblin(dt) {
  const b = bok; if (!b) return;
  b.t += dt; b.anim += dt * 14;
  if (b.phase === 'dead') { if (b.t > .7) bok = null; return; }
  if (b.stun > 0) { b.stun -= dt; b.x += b.kx * dt; b.d += b.kd * dt; }
  else {
    const dx = P.px - b.x, dd = (P.pd - b.d) * DEPTH_PX, dist = Math.hypot(dx, dd) || 1;
    if (Math.abs(dx) > 6) b.face = Math.sign(dx);
    if (b.phase === 'idle') { if (clearT > 3.5 || dist < 240) { b.phase = 'run'; b.t = 0; } }
    else if (b.phase === 'run') {
      if (dist < 46) { b.phase = 'windup'; b.t = 0; }
      else { const sp = 100; b.x += dx / dist * sp * dt; b.d += dd / dist * sp * dt / DEPTH_PX; }
    } else if (b.phase === 'windup' && b.t > .55) {
      b.phase = 'swing'; b.t = 0;
      if (dist < 64 && P.inv <= 0) hurtLink(b);
    } else if (b.phase === 'swing' && b.t > .55) { b.phase = 'run'; b.t = 0; }
  }
  b.d = Math.max(.05, Math.min(DMAX - .1, b.d));
  b.x = Math.max(W / 2 - PLAT_HW + 40, Math.min(W / 2 + PLAT_HW - 40, b.x));
}
function hurtLink(b) {
  P.hearts--; P.inv = 1.2; shake = .3; P.flash = .15; sfxHurt();
  P.px += Math.sign(P.px - b.x || 1) * 60;
  P.pd = Math.max(.02, Math.min(DMAX - .05, P.pd + (P.pd >= b.d ? .12 : -.12)));
  if (P.hearts <= 0) { overMsg = 'Defeated!'; saveBest(); state = 'over'; }
}
function attack() {
  if (state !== 'plateau' || !inv.sword || P.atkCd > 0) return;
  P.atk = .25; P.atkCd = .45; sfxSwing();
  const b = bok;
  if (!b || b.phase === 'dead') return;
  P.side = Math.sign(b.x - P.px) || P.side;
  if (pdist(P.px, P.pd, b.x, b.d) > 72) return;
  b.hp--; b.stun = .35; sfxHit(); shake = .15;
  const len = pdist(P.px, P.pd, b.x, b.d) || 1;
  b.kx = (b.x - P.px) / len * 240; b.kd = (b.d - P.pd) * DEPTH_PX / len * 240 / DEPTH_PX;
  b.phase = 'run'; b.t = 0;
  const s = surfaceY(), bx = xAt(b.x, b.d), by = yAt(s, b.d) - 30 * scaleAt(b.d);
  dust(bx, by, 8, '255,240,200');
  if (b.hp <= 0) {
    b.phase = 'dead'; b.t = 0; dust(bx, by, 26, '90,70,90');
    if (chest) { chest.locked = false; unlockT = 2.5; sfxUnlock(); }
  }
}

function levelComplete() {
  state = 'cleared'; clearT = 0; startY = P.y; P.inv = 0; P.stam = 100; P.exhausted = false;
  P.px = P.x; P.pd = .02; P.face = 'back';
  for (const r of rocks) dust(r.x, r.y, 10, '160,135,110');
  rocks = []; warns = [];
  healed = P.hearts < 3; P.hearts = Math.min(3, P.hearts + 1); // reward: recover a heart
  saveBest();
}

function hit(r) {
  if (inv.shield && !P.shieldUsed) {  // the wooden shield soaks up the first rock each level
    r.dead = true; P.shieldUsed = true; P.inv = .8; sfxBlock();
    dust(r.x, r.y, 16, '200,170,120'); floats.push({ x: P.x, y: P.y - 50, t: 1, msg: 'Blocked!' });
    return;
  }
  overMsg = 'You fell!';
  r.dead = true; P.hearts--; P.inv = 1.6; shake = .35; P.flash = .15;
  dust(r.x, r.y, 22, '160,135,110'); dust(P.x, P.y, 8, '255,90,80');
  P.y = Math.min(H - 34, P.y + 28);
  if (P.hearts <= 0) {
    state = 'falling'; P.vy = -220; saveBest();
  }
}

// ---------- Drawing ----------
function limb(x1, y1, x2, y2, col, w) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';

}
function arm(sx, sy, hx, hy, side) {
  const ex = (sx + hx) / 2 + side * 5, ey = (sy + hy) / 2 + 2;

  ctx.fillStyle = '#e8bd92'; ctx.beginPath(); ctx.arc(hx, hy, 3.6, 0, 7); ctx.fill();
}

// sword slash in front of Link while attacking
function drawSlash(s) {

// Link standing on the plateau, scaled for how far away he is
function drawPlateauLink(s) {
  const k = scaleAt(P.pd), x = xAt(P.px, P.pd), feet = yAt(s, P.pd);

// the next level's cliff, rising across the whole far side of the plateau
function drawNextCliff(s) {
  const k = scaleAt(DMAX), base = yAt(s, DMAX), half = W / 2 + 10, top = -10;
  if (base < top) return;
  const jag = deco.jag, n = jag.length - 1;
  ctx.save(); ctx.beginPath();
  for (let i = 0; i <= n; i++) ctx.lineTo(W / 2 - half - jag[i][0] * k * (1 - i / n * .5), lerp(base, top, i / n));
  for (let i = n; i >= 0; i--) ctx.lineTo(W / 2 + half + jag[i][1] * k * (1 - i / n * .5), lerp(base, top, i / n));
  ctx.closePath(); ctx.clip();
  // one tile wide (no side seams), tiled vertically since the texture wraps top to bottom
  const tw = 2 * half + 60, th = TH * tw / W;
  for (let y = base - th; y + th > top; y -= th) ctx.drawImage(wall, W / 2 - tw / 2, y, tw, th + 1);
  // atmospheric haze, thicker toward the base
  let g = ctx.createLinearGradient(0, top, 0, base);
  g.addColorStop(0, 'rgba(160,185,215,.25)'); g.addColorStop(1, 'rgba(190,210,225,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, base - top);
  ctx.restore();
  g = ctx.createLinearGradient(0, base - 2, 0, base + 8 * k * 3);
  g.addColorStop(0, 'rgba(20,30,20,.35)'); g.addColorStop(1, 'rgba(20,30,20,0)');
  ctx.fillStyle = g; ctx.fillRect(W / 2 - half - 20, base - 2, 2 * half + 40, 8 * k * 3 + 2);
}

// the plateau: a grassy field receding toward the next cliff; s = screen y of its lip
function drawPlateau(s, actors = []) {
  const d = deco, far = DMAX + .6, farY = yAt(s, far);
  let g = ctx.createLinearGradient(0, farY - 380, 0, farY);
  g.addColorStop(0, '#5f9ad6'); g.addColorStop(.75, '#a9cbe6'); g.addColorStop(1, '#f4dcae');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, farY);
  // hazy lowlands far below, seen past the sides of the plateau
  g = ctx.createLinearGradient(0, farY, 0, s);
  g.addColorStop(0, '#b8cdc8'); g.addColorStop(1, '#6f8f80');
  ctx.fillStyle = g; ctx.fillRect(0, farY, W, s - farY);
  const ridge = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-20, farY + 1);
    for (const [x, h] of pts) ctx.lineTo(x, farY - h); ctx.lineTo(W + 40, farY + 1); ctx.closePath(); ctx.fill(); };
  ridge(d.far, 'rgba(110,130,165,.75)');
  ridge(d.near, 'rgba(78,108,110,.9)');
  // the field, as a trapezoid in perspective, with mown stripes for depth
  const pt = (x, dd) => [xAt(x, dd), yAt(s, dd)];
  const band = (d0, d1, col) => {
    const q = [pt(W / 2 - PLAT_HW, d0), pt(W / 2 + PLAT_HW, d0), pt(W / 2 + PLAT_HW, d1), pt(W / 2 - PLAT_HW, d1)];
    ctx.fillStyle = col; ctx.beginPath(); q.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); };
  g = ctx.createLinearGradient(0, farY, 0, s);
  g.addColorStop(0, '#a3c784'); g.addColorStop(1, '#5f9440');
  band(0, far, g);
  for (let k = 0; k < far / .2; k += 2) band(k * .2, (k + 1) * .2, 'rgba(255,255,200,.06)');
  for (const [x, dd, col] of d.flowers) {

  drawNextCliff(s);

  const items = [

      const k = scaleAt(dd) * 1.6, tx = xAt(x, dd), y = yAt(s, dd);
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(tx, y, 18 * k, 5 * k, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#5a3e26'; ctx.fillRect(tx - 3 * k, y - 26 * k, 6 * k, 26 * k);
      ctx.fillStyle = '#3f7a3a'; ctx.beginPath(); ctx.arc(tx, y - 34 * k, 16 * k, 0, 7); ctx.arc(tx - 11 * k, y - 26 * k, 11 * k, 0, 7);
      ctx.arc(tx + 11 * k, y - 26 * k, 11 * k, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(200,240,150,.25)'; ctx.beginPath(); ctx.arc(tx - 5 * k, y - 40 * k, 7 * k, 0, 7); ctx.fill(); }]),
    ...d.bushes.map(([x, dd, r]) => [dd, () => {
      const k = scaleAt(dd); ctx.fillStyle = '#4c8a3c'; ctx.beginPath();
      ctx.ellipse(xAt(x, dd), yAt(s, dd), r * 1.4 * k, r * .9 * k, 0, Math.PI, 0); ctx.fill(); }]),
  ];
  items.push(...actors);
  items.sort((a, b) => b[0] - a[0]).forEach(([, f]) => f());
  // overhanging grassy lip and its shadow on the cliff below
  g = ctx.createLinearGradient(0, s, 0, s + 16);
  g.addColorStop(0, 'rgba(15,9,6,.6)'); g.addColorStop(1, 'rgba(15,9,6,0)');
  ctx.fillStyle = g; ctx.fillRect(0, s, W, 16);
  ctx.fillStyle = '#4f8537'; ctx.fillRect(0, s - 3, W, 6);
  ctx.lineWidth = 1.6;
  for (const [x, h, lean] of d.blades) {
    ctx.strokeStyle = h > 9 ? '#9fcf5a' : '#6aa843'; ctx.beginPath(); ctx.moveTo(x, s + 2); ctx.lineTo(x + lean, s + 2 - h); ctx.stroke(); }
}

function drawRock(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(6, 8, r.size, r.size * .85, 0, 0, 7); ctx.fill();
  ctx.rotate(r.rot);
  const n = r.pts.length;
  ctx.beginPath();
  r.pts.forEach((m, k) => { const a = k / n * Math.PI * 2; const x = Math.cos(a) * r.size * m, y = Math.sin(a) * r.size * m;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  const g = ctx.createRadialGradient(-r.size * .35, -r.size * .35, r.size * .1, 0, 0, r.size * 1.1);
  g.addColorStop(0, `hsl(28,12%,${r.shade + 22}%)`); g.addColorStop(1, `hsl(24,14%,${r.shade - 12}%)`);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(20,12,8,.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(20,12,8,.4)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-r.size * .3, -r.size * .1); ctx.lineTo(r.size * .2, r.size * .25); ctx.lineTo(r.size * .1, r.size * .5); ctx.stroke();
  ctx.restore();
}

function heart(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

  ctx.fillStyle = fill ? '#e8333d' : 'rgba(40,20,20,.6)'; ctx.fill();
  ctx.strokeStyle = '#fff4e6'; ctx.lineWidth = 1.3 / s * 1.4; ctx.stroke();
  if (fill) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-3.5, -3, 1.6, 1, -.6, 0, 7); ctx.fill(); }
  ctx.restore();
}

function staminaWheel() {
  if (P.stam >= 100 && !P.exhausted) return;
  const x = P.x + 30, y = P.y - 36, low = P.stam < 30 || P.exhausted;
  ctx.save();
  ctx.lineWidth = 6; ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
  const col = P.exhausted ? (Math.sin(time * 18) > 0 ? '#ff6a3d' : '#d0392b') : low ? '#f2c14e' : '#7ee25a';
  ctx.strokeStyle = col; ctx.beginPath();
  ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * P.stam / 100); ctx.stroke();
  ctx.restore();
}

function text(s, x, y, size, col = '#f3ead2', align = 'center') {

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((rand() - .5) * 12 * shake / .35, (rand() - .5) * 12 * shake / .35);

  const off = scroll % TH;
  ctx.drawImage(wall, 0, off, W, TH); ctx.drawImage(wall, 0, off - TH, W, TH);

  // warm light from above, haze below
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(255,220,160,.18)'); g.addColorStop(.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(120,160,200,.25)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const surf = surfaceY();
  const onPlateau = (state === 'cleared' && clearT >= .7) || state === 'plateau' || state === 'enter' || state === 'item' ||
    (state === 'paused' && pausedFrom === 'plateau');
  const actors = [];
  if (chest) actors.push([chest.d, () => drawChest(chest, surf)]);
  if (bok && onPlateau) actors.push([bok.d, () => drawBokoblin(bok, surf)]);
  if (onPlateau) actors.push([P.pd, () => {
    if (!(P.inv > 0 && (P.inv * 14 | 0) % 2)) drawPlateauLink(surf);
    drawSlash(surf);
  }]);
  if (surf > -20) drawPlateau(surf, actors);

  // falling-rock warnings
  const wy = Math.max(0, surf);
  for (const w of warns) {
    const a = .5 + .5 * Math.sin(w.t * 30);
    ctx.fillStyle = `rgba(255,70,50,${.35 + a * .5})`;
    ctx.beginPath(); ctx.moveTo(w.x, wy + 30); ctx.lineTo(w.x - 13, wy + 8); ctx.lineTo(w.x + 13, wy + 8); ctx.closePath(); ctx.fill();
    text('!', w.x, wy + 17, 16, '#fff');
    ctx.fillStyle = `rgba(255,70,50,${.06 + a * .06})`; ctx.fillRect(w.x - w.size, wy, w.size * 2, H);
  }

  for (const p of parts) { ctx.fillStyle = `rgba(${p.col},${Math.max(0, p.life)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  if (!onPlateau && state !== 'title') drawLink();
  for (const r of rocks) drawRock(r);
  if (state === 'play') staminaWheel();

  // drifting cloud wisps in front for depth
  for (const c of clouds) {
    ctx.fillStyle = `rgba(235,240,245,${c.a})`;
    for (const [ox, oy, k] of [[0, 0, 1], [c.s * .7, 6, .7], [-c.s * .7, 8, .6]]) {
      ctx.beginPath(); ctx.ellipse(c.x + ox, c.y + oy, c.s * k, c.s * .35 * k, 0, 0, 7); ctx.fill(); }
  }

  // vignette
  g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (P.flash > 0) { ctx.fillStyle = `rgba(255,40,40,${P.flash * 2})`; ctx.fillRect(0, 0, W, H); }
  // fade to black between levels
  const fade = state === 'enter' ? fadeT / .7 : fadeIn / .6;
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  // HUD
  if (state !== 'title') {
    for (let i = 0; i < 3; i++) heart(26 + i * 30, 52, 1.5, i < P.hearts);
    // collected gear under the hearts
    let ix = 22;
    for (const id of ['sword', 'shield']) if (inv[id]) {
      ctx.save(); ctx.translate(ix, 86); ctx.scale(.2, .2);
      ctx.globalAlpha = id === 'shield' && P.shieldUsed ? .35 : 1; ITEMS[id].draw(); ctx.restore(); ix += 30;
    }
    text(`Level ${level}`, W - 18, 46, 24, '#f5dc8a', 'right');
    text(`${height()} / 100 m`, W - 18, 72, 15, '#f3ead2', 'right');
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(W - 118, 86, 100, 6);
    ctx.fillStyle = '#7ee25a'; ctx.fillRect(W - 118, 86, height(), 6);
  }

  if (state === 'play' && bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT / .5, (2.2 - bannerT) / .3);
    text(`Level ${level}`, W / 2, H * .5, 52, '#f5dc8a');
    text(level === 1 ? 'Reach the plateau at 100 m' : 'More rocks incoming!', W / 2, H * .5 + 44, 18);
    ctx.globalAlpha = 1;
  }
  if (state === 'cleared' || state === 'plateau' || (state === 'paused' && pausedFrom === 'plateau')) {
    const a = Math.max(0, Math.min(1, clearT / .4, (4.6 - clearT) / .6));
    if (a > 0) {
      ctx.globalAlpha = a;
      const cfg = PLATEAUS[level], hint = !cfg ? null : cfg.guard ? 'A Bokoblin guards a locked chest. Defeat it!' : 'A treasure chest! Walk over to open it.';
      ctx.fillStyle = 'rgba(8,14,20,.6)'; ctx.fillRect(0, H * .14, W, hint ? 142 : 116);
      text(`Level ${level} Complete!`, W / 2, H * .14 + 34, 38, '#f5dc8a');
      text(healed ? 'You reached the plateau. +1 heart' : 'You reached the plateau.', W / 2, H * .14 + 68, 16);
      if (hint) text(hint, W / 2, H * .14 + 94, 16, '#ffe08a');
      text(`Walk to the cliff ahead to start Level ${level + 1}`, W / 2, H * .14 + (hint ? 120 : 94), 16, '#7ee25a');
      ctx.globalAlpha = 1;
    }
  }

  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.t * 2); text(f.msg, f.x, f.y, 18, '#fff3c4'); ctx.globalAlpha = 1; }
  if (unlockT > 0 && state === 'plateau') {
    ctx.globalAlpha = Math.min(1, unlockT); text('The chest is unlocked!', W / 2, H * .3, 22, '#f5dc8a'); ctx.globalAlpha = 1;
  }
  if (state === 'item') drawPopup();

  if (state === 'title') overlay(() => {
    text('The Amazing Link\'s:', W / 2, H * .3, 48, '#f5dc8a');
    text('Mountain Adventure', W / 2, H * .3 + 54, 48, '#f5dc8a');
    text('Arrow keys / WASD to climb', W / 2, H * .62, 16, '#d8ccb0');
    text('Rest when your stamina runs low', W / 2, H * .62 + 26, 16, '#d8ccb0');
    text('Reach the plateau every 100 m to clear a level', W / 2, H * .62 + 52, 16, '#d8ccb0');
    text('P to pause', W / 2, H * .62 + 78, 16, '#d8ccb0');
    if (Math.sin(time * 4) > -.3) text('Press SPACE or tap to start', W / 2, H * .82, 20, '#7ee25a');
    if (best) text(`Best: ${best} m`, W / 2, H * .88, 16, '#d8ccb0');
  });
  if (state === 'paused') overlay(() => { text('Paused', W / 2, H * .45, 44, '#f5dc8a'); text('Press P or tap to resume', W / 2, H * .53, 18); });
  if (state === 'over') overlay(() => {
    text(overMsg, W / 2, H * .36, 48, '#f5dc8a');
    text(`Level ${level} · ${height()} m`, W / 2, H * .46, 22);
    text(`Total climbed: ${total()} m`, W / 2, H * .51, 18);
    text(total() >= best && best > 0 ? 'New best!' : `Best: ${best} m`, W / 2, H * .56, 18, '#7ee25a');
    if (Math.sin(time * 4) > -.3) text('Press SPACE or tap to climb again', W / 2, H * .68, 18);
  });
}
function overlay(fn) { ctx.fillStyle = 'rgba(8,14,20,.62)'; ctx.fillRect(0, 0, W, H); fn(); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  pollGamepad();
  if (state === 'item') popupT += dt;
  if (!['title', 'over', 'paused', 'item'].includes(state)) update(dt);
  const showAtk = touch && state === 'plateau' && inv.sword && !!bok && bok.phase !== 'dead';
  if (atkBtn.style.display !== (showAtk ? 'block' : 'none')) atkBtn.style.display = showAtk ? 'block' : 'none';
  else { time += dt; for (const c of clouds) { c.x += c.v * dt; if (c.x - c.s * 2 > W) c.x = -c.s * 2; } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
